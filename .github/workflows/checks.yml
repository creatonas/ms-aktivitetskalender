name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          php --version
          node --version
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - name: JavaScript syntax
        run: find . -type f -name '*.js' ! -name '*.min.js' -print0 | xargs -0 -r -n 1 node --check
